l='#111'/><text x='580' y='360' font-size='12' text-anchor='middle' font-weight='bold' fill='#2e9e44' >D13</text><rect x='604' y='240' width='32' height='18' rx='3' fill='#c9a227' stroke='#6b5510'/><text x='620' y='253' font-size='11' text-anchor='middle' font-weight='bold' fill='#111' >DO</text><text x='620' y='360' font-size='12' text-anchor='middle' font-weight='bold' fill='#666666' >empty</text><text x='560' y='64' font-size='14' text-anchor='middle' font-weight='bold' fill='#1a1a1a' >Back: 4 pads</text><text x='400' y='394' font-size='13' text-anchor='middle' font-weight='normal' fill='#666666' >DI (or DIN) means data in and goes to D13. DO (or DOUT) means data out and stays empty.</text><text x='400' y='414' font-size='13' text-anchor='middle' font-weight='normal' fill='#666666' >Buy it with wires already attached, ideally ending in female plugs like the black ends above.</text></svg>
