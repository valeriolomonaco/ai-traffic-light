<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 252' width='600' height='252' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>USB data cable</title><rect width='600' height='252' fill='#ffffff'/><text x='300' y='32' font-size='18' text-anchor='middle' font-weight='bold' fill='#1a1a1a' >USB data cable</text><rect x='40' y='92' width='70' height='36' rx='3' fill='#c4c8ce' stroke='#7c8189' stroke-width='2'/><rect x='110' y='98' width='26' height='24' rx='4' fill='#333'/><text x='75' y='152' font-size='12' text-anchor='middle' font-weight='bold' fill='#1a1a1a' >USB-A (computer)</text><path d='M136 110 C 260 60, 340 160, 450 110' stroke='#333' stroke-width='8' fill='none'/><rect x='450' y='98' width='30' height='24' rx='4' fill='#333'/><path d='M480 102 L516 102 L512 118 L484 118 Z' fill='#c4c8ce' stroke='#7c8189' stroke-width='2'/><text x='500' y='152' font-size='12' text-anchor='middle' font-weight='bold' fill='#1a1a1a' >micro-USB (board)</text><text x='500' y='170' font-size='12' text-anchor='middle' font-weight='normal' fill='#666666' >or USB-C: check your board</text><text x='300' y='212' font-size='13' text-anchor='middle' font-weight='normal' fill='#666666' >It must be a data cable. Charge-only cables power the board but cannot upload code.</text><text x='300' y='232' font-size='13' text-anchor='middle' font-weight='normal' fill='#666666' >If the computer shows no new COM port, try another cable first.</text></svg>
