<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 520 380' width='520' height='380' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>SSD1306 OLED screen</title><rect width='520' height='380' fill='#ffffff'/><text x='260' y='32' font-size='18' text-anchor='middle' font-weight='bold' fill='#1a1a1a' >0.96 inch OLED screen, SSD1306, I2C (4 pins)</text><rect x='120' y='110' width='280' height='200' rx='8' fill='#1f3a5f' stroke='#14263f' stroke-width='3'/><path d='M205 128 L205 84' stroke='#222222' stroke-width='5' stroke-linecap='round'/><rect x='198' y='58' width='14' height='26' rx='2' fill='#111'/><rect x='198' y='121' width='14' height='14' rx='2' fill='#c9a227'/><text x='205' y='154' font-size='12' text-anchor='middle' font-weight='bold' fill='#ffffff' >GND</text><text x='205' y='50' font-size='12' text-anchor='middle' font-weight='bold' fill='#222222' >GND</text><path d='M241 128 L241 84' stroke='#d43c3c' stroke-width='5' stroke-linecap='round'/><rect x='234' y='58' width='14' height='26' rx='2' fill='#111'/><rect x='234' y='121' width='14' height='14' rx='2' fill='#c9a227'/><text x='241' y='154' font-size='12' text-anchor='middle' font-weight='bold' fill='#ffffff' >VCC</text><text x='241' y='50' font-size='12' text-anchor='middle' font-weight='bold' fill='#d43c3c' >3V3</text><path d='M277 128 L277 84' stroke='#2f6fd6' stroke-width='5' stroke-linecap='round'/><rect x='270' y='58' width='14' height='26' rx='2' fill='#111'/><rect x='270' y='121' width='14' height='14' rx='2' fill='#c9a227'/><text x='277' y='154' font-size='12' text-anchor='middle' font-weight='bold' fill='#ffffff' >SCL</text><text x='277' y='50' font-size='12' text-anchor='middle' font-weight='bold' fill='#2f6fd6' >D22</text><path d='M313 128 L313 84' stroke='#e8891c' stroke-width='5' stroke-linecap='round'/><rect x='306' y='58' width='14' height='26' rx='2' fill='#111'/><rect x='306' y='121' width='14' height='14' rx='2' fill='#c9a227'/><text x='313' y='154' font-size='12' text-anchor='middle' font-weight='bold' fill='#ffffff' >SDA</text><text x='313' y='50' font-size='12' text-anchor='middle' font-weight='bold' fill='#e8891c' >D21</text><text x='80' y='50' font-size='12' text-anchor='start' font-weight='normal' fill='#666666' >to ESP32:</text><rect x='160' y='178' width='200' height='104' rx='3' fill='#05070a' stroke='#333'/><text x='172' y='214' font-size='26' text-anchor='start' font-weight='bold' fill='#8fd3ff' font-family='Consolas, Menlo, monospace'>WORKING</text><text x='172' y='244' font-size='15' text-anchor='start' font-weight='normal' fill='#8fd3ff' font-family='Consolas, Menlo, monospace'>athlete paper</text><text x='172' y='270' font-size='15' text-anchor='start' font-weight='normal' fill='#8fd3ff' font-family='Consolas, Menlo, monospace'>for 3m</text><text x='260' y='340' font-size='13' text-anchor='middle' font-weight='normal' fill='#666666' >The pin labels are printed on the board. Some screens swap GND and VCC,</text><text x='260' y='358' font-size='13' text-anchor='middle' font-weight='normal' fill='#666666' >so always connect by the printed label, not by position.</text></svg>
