<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 372' width='600' height='372' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Female to female jumper wires</title><rect width='600' height='372' fill='#ffffff'/><text x='300' y='32' font-size='18' text-anchor='middle' font-weight='bold' fill='#1a1a1a' >Female-to-female jumper wires (Dupont)</text><rect x='60' y='63' width='34' height='14' rx='2' fill='#111'/><rect x='506' y='63' width='34' height='14' rx='2' fill='#111'/><path d='M94 70 C 220 90, 380 50, 506 70' stroke='#222222' stroke-width='5' fill='none'/><rect x='60' y='87' width='34' height='14' rx='2' fill='#111'/><rect x='506' y='87' width='34' height='14' rx='2' fill='#111'/><path d='M94 94 C 220 114, 380 74, 506 94' stroke='#d43c3c' stroke-width='5' fill='none'/><rect x='60' y='111' width='34' height='14' rx='2' fill='#111'/><rect x='506' y='111' width='34' height='14' rx='2' fill='#111'/><path d='M94 118 C 220 138, 380 98, 506 118' stroke='#2e9e44' stroke-width='5' fill='none'/><rect x='60' y='135' width='34' height='14' rx='2' fill='#111'/><rect x='506' y='135' width='34' height='14' rx='2' fill='#111'/><path d='M94 142 C 220 162, 380 122, 506 142' stroke='#2f6fd6' stroke-width='5' fill='none'/><rect x='60' y='159' width='34' height='14' rx='2' fill='#111'/><rect x='506' y='159' width='34' height='14' rx='2' fill='#111'/><path d='M94 166 C 220 186, 380 146, 506 166' stroke='#e8891c' stroke-width='5' fill='none'/><rect x='150' y='205' width='300' height='122' rx='8' fill='#f5f5f5' stroke='#ccc'/><rect x='190' y='240' width='70' height='34' rx='3' fill='#111'/><rect x='190' y='251' width='10' height='12' fill='#555'/><path d='M260 257 L300 257' stroke='#2e9e44' stroke-width='6'/><rect x='330' y='251' width='70' height='12' fill='#c9a227'/><rect x='395' y='240' width='30' height='34' fill='#222'/><text x='225' y='230' font-size='12' text-anchor='middle' font-weight='bold' fill='#1a1a1a' >female end</text><text x='370' y='230' font-size='12' text-anchor='middle' font-weight='bold' fill='#1a1a1a' >board pin</text><text x='300' y='308' font-size='12' text-anchor='middle' font-weight='normal' fill='#666666' >The hole slides over the pin. Push firmly, no tools needed.</text><text x='300' y='352' font-size='13' text-anchor='middle' font-weight='normal' fill='#666666' >Get 10 to 20 cm wires. The lamp needs 7; a set of 40 leaves plenty of spares.</text></svg>
